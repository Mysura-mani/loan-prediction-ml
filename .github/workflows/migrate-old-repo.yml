name: Migrate old repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
      - name: Copy project from old public repository
        run: |
          git clone --depth 1 https://github.com/Mysuramani/Loan-prediction-Data-Mining-Machine-learning.git /tmp/source
          rm -rf /tmp/source/.git
          rsync -a --exclude '.github/workflows/migrate-old-repo.yml' /tmp/source/ ./
      - name: Commit migrated files
        run: |
          git config user.name "Mysura Reddy"
          git config user.email "pmysura1166@gmail.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes to migrate."; else git commit -m "Migrate project from old GitHub account" && git push; fi
